name: Sync milestones

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/milestones.yml
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: milestones
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Create milestones and assign issues
        uses: actions/github-script@v7
        with:
          script: |
            // Idempotent: creates missing milestones, updates descriptions that drifted
            // and assigns each issue only when it is not already in the right milestone.
            // Closed issues are assigned too, so finished work stays in its milestone.
            const milestones = [
              {
                title: 'v1.1 Experiencia acessivel',
                description: 'Toque, Stage Proof, leitura de tela, contraste, macro e consulta dos looks (#12 a #16).',
                issues: [12, 13, 14, 15, 16],
              },
              {
                title: 'v1.2 Feed Instagram',
                description: 'Lado GANJA do feed Instagram: adaptador, faixa do rodapé e página #/feed (#4, #5, PRD #17).',
                issues: [4, 5, 17],
              },
              {
                title: 'Piloto Instagram',
                description: 'Validação do piloto com a conta real (#6). Bloqueado por coletivo-inspira/vitrine#48.',
                issues: [6],
              },
            ];
            const { owner, repo } = context.repo;

            const existing = await github.paginate(github.rest.issues.listMilestones, {
              owner,
              repo,
              state: 'all',
              per_page: 100,
            });
            const byTitle = new Map(existing.map((milestone) => [milestone.title, milestone]));

            for (const wanted of milestones) {
              let milestone = byTitle.get(wanted.title);
              if (!milestone) {
                ({ data: milestone } = await github.rest.issues.createMilestone({
                  owner,
                  repo,
                  title: wanted.title,
                  description: wanted.description,
                }));
                core.info(`Created milestone "${wanted.title}" (#${milestone.number})`);
              } else if ((milestone.description ?? '') !== wanted.description) {
                await github.rest.issues.updateMilestone({
                  owner,
                  repo,
                  milestone_number: milestone.number,
                  description: wanted.description,
                });
                core.info(`Updated description of "${wanted.title}"`);
              } else {
                core.info(`Milestone "${wanted.title}" already exists (#${milestone.number})`);
              }

              for (const issue_number of wanted.issues) {
                let issue;
                try {
                  ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number }));
                } catch (error) {
                  if (error.status === 404) {
                    core.warning(`#${issue_number} not found, skipping`);
                    continue;
                  }
                  throw error;
                }
                if (issue.milestone?.number === milestone.number) {
                  core.info(`#${issue_number} already in "${wanted.title}"`);
                  continue;
                }
                await github.rest.issues.update({
                  owner,
                  repo,
                  issue_number,
                  milestone: milestone.number,
                });
                core.info(`#${issue_number} -> "${wanted.title}"`);
              }
            }
